<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gerador de folha de QR Code Wi-Fi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f4f2;
      --card: #fff;
      --fg: #1a1a1a;
      --mut: #6b6b6b;
      --bd: #d9d9d4;
      --ac: #1a1a1a;
      --acfg: #fff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #161615;
        --card: #222221;
        --fg: #f0f0ee;
        --mut: #9a9a95;
        --bd: #3a3a38;
        --ac: #f0f0ee;
        --acfg: #161615
      }
    }

    :root[data-theme="dark"] {
      --bg: #161615;
      --card: #222221;
      --fg: #f0f0ee;
      --mut: #9a9a95;
      --bd: #3a3a38;
      --ac: #f0f0ee;
      --acfg: #161615
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr 1fr
    }

    @media (max-width:700px) {
      main {
        grid-template-columns: 1fr
      }
    }

    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      grid-column: 1/-1
    }

    p.sub {
      margin: 0;
      color: var(--mut);
      font-size: 14px;
      grid-column: 1/-1
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 20px
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 6px
    }

    label:first-child {
      margin-top: 0
    }

    input[type=text],
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg)
    }

    .chk {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 400;
      margin-top: 14px
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border: 0;
      border-radius: 8px;
      background: var(--ac);
      color: var(--acfg);
      cursor: pointer
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    #msg {
      font-size: 13px;
      color: var(--mut);
      margin-top: 10px;
      min-height: 18px
    }

    .prev {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    .pc {
      width: 220px;
      border: 2px solid #111;
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      background: #fff;
      color: #111
    }

    .pc b {
      display: block;
      font-size: 14px
    }

    .pc span {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      word-break: break-all
    }

    .pc svg {
      width: 150px;
      height: 150px;
      display: block;
      margin: 0 auto 8px
    }

    .pc small {
      font-size: 13px;
      word-break: break-all
    }

    .cap {
      font-size: 12px;
      color: var(--mut);
      margin-top: 10px
    }
  </style>
</head>

<body>
  <main>
    <h1>Folha de QR Code Wi-Fi</h1>
    <p class="sub">Preencha os dados da rede e gere um PDF A4 com 6 cartões para recortar e entregar aos clientes.</p>

    <div class="panel">
      <label for="ssid">Nome da rede (SSID)</label>
      <input type="text" id="ssid" value="SSID DA REDE" autocomplete="off">
      <label for="enc">Criptografia</label>
      <select id="enc">
        <option value="WPA">WPA / WPA2 / WPA3</option>
        <option value="WEP">WEP</option>
        <option value="nopass">Sem senha (rede aberta)</option>
      </select>
      <div id="pwrow">
        <label for="pw">Senha</label>
        <input type="text" id="pw" value="12345678" autocomplete="off">
      </div>
      <label class="chk"><input type="checkbox" id="hidden"> Rede oculta</label>
      <label class="chk"><input type="checkbox" id="showpw" checked> Mostrar a senha impressa no cartão</label>
      <button id="go">Gerar PDF</button>
      <div id="msg"></div>
    </div>

    <div class="panel prev">
      <div class="pc" id="pc"></div>
      <div class="cap">Pré-visualização de um cartão</div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => s.replace(/([\\;,:"])/g, '\\$1');

    function payload() {
      const enc = $('enc').value, ssid = $('ssid').value, pw = $('pw').value;
      let s = 'WIFI:T:' + enc + ';S:' + esc(ssid) + ';';
      if (enc !== 'nopass') s += 'P:' + esc(pw) + ';';
      if ($('hidden').checked) s += 'H:true;';
      return s + ';';
    }
    function makeQR() {
      const q = qrcode(0, 'M'); q.addData(payload()); q.make(); return q;
    }
    function preview() {
      const open = $('enc').value === 'nopass';
      $('pwrow').style.display = open ? 'none' : 'block';
      const ssid = $('ssid').value.trim();
      $('go').disabled = !ssid || (!open && !$('pw').value);
      if (!ssid) {$('pc').innerHTML = ''; return;}
      let q; try {q = makeQR();} catch (e) {$('pc').textContent = 'Texto longo demais para o QR.'; $('go').disabled = true; return;}
      const show = $('showpw').checked && !open;
      const t = document.createElement('div');
      t.innerHTML = '<b>Rede</b><span></span>' + q.createSvgTag({cellSize: 4, margin: 0, scalable: true}) + (show ? '<small></small>' : '');
      t.querySelector('span').textContent = ssid;
      if (show) t.querySelector('small').textContent = 'Senha: ' + $('pw').value;
      $('pc').replaceChildren(...t.childNodes);
    }

    function build() {
      const {jsPDF} = window.jspdf;
      const doc = new jsPDF({unit: 'mm', format: 'a4'});
      const q = makeQR(), n = q.getModuleCount();
      const ssid = $('ssid').value.trim(), open = $('enc').value === 'nopass';
      const show = $('showpw').checked && !open;
      const W = 78, H = 84, G = 8, mx = (210 - 2 * W - G) / 2, my = (297 - 3 * H - 2 * G) / 2;
      const qs = 50, cell = qs / n;
      for (let r = 0; r < 3; r++)for (let c = 0; c < 2; c++) {
        const x = mx + c * (W + G), y = my + r * (H + G);
        doc.setDrawColor(0); doc.setLineWidth(0.6);
        doc.roundedRect(x, y, W, H, 5, 5, 'S');
        doc.setTextColor(0);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.text('Rede', x + W / 2, y + 10, {align: 'center'});
        doc.setFont('helvetica', 'normal'); doc.setFontSize(11);
        doc.text(doc.splitTextToSize(ssid, W - 10)[0], x + W / 2, y + 16, {align: 'center'});
        const qx = x + (W - qs) / 2, qy = y + 20;
        doc.setFillColor(0, 0, 0);
        for (let i = 0; i < n; i++)for (let j = 0; j < n; j++)
          if (q.isDark(i, j)) doc.rect(qx + j * cell, qy + i * cell, cell + 0.02, cell + 0.02, 'F');
        if (show) doc.text(doc.splitTextToSize('Senha: ' + $('pw').value, W - 10)[0], x + W / 2, y + H - 7, {align: 'center'});
        else if (open) doc.text('Rede aberta', x + W / 2, y + H - 7, {align: 'center'});
      }
      return doc;
    }

    async function generate() {
      const msg = $('msg'); msg.textContent = '';
      const doc = build();
      const name = 'wifi-' + $('ssid').value.trim().replace(/[^\w-]+/g, '_') + '.pdf';
      let dl = null; try {dl = await claude.use('downloads');} catch (e) { }
      if (dl) {
        try {await dl.save({filename: name, data: doc.output('blob')}); msg.textContent = 'PDF pronto.';}
        catch (e) {msg.textContent = e && e.code === 'declined' ? 'Download cancelado.' : 'Não foi possível salvar o PDF.';}
      } else {
        try {doc.save(name); msg.textContent = 'PDF gerado.';} catch (e) {msg.textContent = 'Download indisponível neste ambiente.';}
      }
    }

    ['ssid', 'pw', 'enc', 'hidden', 'showpw'].forEach(id => $(id).addEventListener('blur', preview));
    $('go').addEventListener('click', generate);
    preview();
  </script>
</body>

</html>
