<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gerador de folha de QR Code Wi-Fi</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="./script.js" defer></script>
</head>

<body>
  <main>
    <h1>Folha de QR Code Wi-Fi</h1>
    <p class="sub">Preencha os dados da rede e gere um PDF A4 com cartões para recortar e entregar aos clientes.</p>

    <div class="panel">
      <label for="ssid">Nome da rede (SSID)</label>
      <input type="text" id="ssid" value="SSID DA REDE" autocomplete="off">
      <label for="enc">Criptografia</label>
      <select id="enc">
        <option value="WPA">WPA / WPA2 / WPA3</option>
        <option value="WEP">WEP</option>
        <option value="nopass">Sem senha (rede aberta)</option>
      </select>
      <div id="pwrow">
        <label for="pw">Senha</label>
        <input type="text" id="pw" value="12345678" autocomplete="off">
      </div>
      <label class="chk"><input type="checkbox" id="hidden"> Rede oculta</label>
      <label class="chk"><input type="checkbox" id="showpw" checked> Mostrar a senha impressa no cartão</label>
      <button id="go">Gerar PDF</button>
      <div id="msg"></div>
    </div>

    <div class="panel prev">
      <div class="pc" id="pc"></div>
      <div class="cap">Pré-visualização de um cartão</div>
    </div>

    <fieldset class="tpl-grid">
      <legend>Modelo do cartão</legend>

      <label class="tpl-opt">
        <input type="radio" name="tpl" value="simple" checked>
        <span class="tpl-thumb tpl-simple">Rede<br>▦<br>Senha</span>
        <span class="tpl-name">Simples</span>
      </label>

      <label class="tpl-opt">
        <input type="radio" name="tpl" value="1">
        <img class="tpl-thumb" src="templates/wifi-modelo-1.png" alt="">
        <span class="tpl-name">Corporativo</span>
      </label>

      <label class="tpl-opt">
        <input type="radio" name="tpl" value="2">
        <img class="tpl-thumb" src="templates/wifi-modelo-2.png" alt="">
        <span class="tpl-name">Minimalista</span>
      </label>

      <label class="tpl-opt">
        <input type="radio" name="tpl" value="3">
        <img class="tpl-thumb" src="templates/wifi-modelo-3.png" alt="">
        <span class="tpl-name">Supermercado</span>
      </label>
    </fieldset>
  </main>
</body>

</html>
